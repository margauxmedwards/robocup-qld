<!--
  ============================================================================
  RCJQ IN THE MEDIA — self-updating WordPress block
  ============================================================================
  Paste this whole file into a custom code / HTML element on the page.

  The QLD page (/challenge-regions/qld/) is built with the GoodLayers page
  builder and has an empty post_content, so there is no Gutenberg canvas and no
  Custom HTML block — use the builder's custom code element instead.

  It shows the latest posts from the RCJQ Facebook, Instagram and LinkedIn
  accounts, read from the feed published by the landing-page repo:

      https://margauxmedwards.github.io/robocup-qld/data/social-posts.json

  That feed is rebuilt daily by a GitHub Action, so this block updates itself.
  None of the three platforms can be read from a browser directly — they all
  put post content behind a login wall — which is why the feed exists.

  To change what it shows, edit the CONFIG block near the bottom of this file.

  If your editor strips <script> tags, use rcjq-in-the-media-static.html
  instead (same design, no JavaScript, posts baked in).
  ============================================================================
-->
<section class="rcjq-media" aria-labelledby="rcjq-media-title">
    <header class="rcjq-media__head">
        <span class="rcjq-media__kicker">Latest updates</span>
        <h2 class="rcjq-media__title" id="rcjq-media-title">RCJQ in the media</h2>
        <p class="rcjq-media__sub">
            Photos, results and announcements as they go up on our Facebook, Instagram and LinkedIn.
        </p>
    </header>

    <div class="rcjq-media__grid" id="rcjq-media-grid">
        <p class="rcjq-media__note">Loading the latest posts&hellip;</p>
    </div>

    <a class="rcjq-media__all" href="https://www.instagram.com/robocupjunior.qld/" target="_blank" rel="noopener">
        Follow @robocupjunior.qld &rarr;
    </a>
</section>

<style>
/* All selectors are namespaced under .rcjq-media so nothing here can leak into
   the Kingster theme's own styles (or pick up styles from it). */
.rcjq-media {
    --rcjq-navy: #192f59;
    --rcjq-navy-deep: #101f3d;
    --rcjq-green: #9dbd38;
    --rcjq-green-bright: #b5d84a;
    --rcjq-green-dark: #5b7413;
    --rcjq-ink: #24292f;
    --rcjq-muted: #5b6470;
    --rcjq-line: #e4e8ee;

    box-sizing: border-box;
    max-width: 1080px;
    margin: 0 auto;
    padding: 8px 0 4px;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    color: var(--rcjq-ink);
    text-align: left;
}

.rcjq-media *,
.rcjq-media *::before,
.rcjq-media *::after { box-sizing: border-box; }

/* ---------- Heading ---------- */
.rcjq-media__head { margin-bottom: 20px; }

.rcjq-media__kicker {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--rcjq-green-dark);
    margin-bottom: 6px;
}

.rcjq-media h2.rcjq-media__title {
    margin: 0 0 8px;
    padding: 0;
    font-size: clamp(1.4rem, 3.4vw, 1.9rem);
    font-weight: 800;
    line-height: 1.2;
    color: var(--rcjq-navy);
    text-transform: none;
}

.rcjq-media p.rcjq-media__sub {
    margin: 0;
    max-width: 620px;
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--rcjq-muted);
}

/* ---------- Grid ---------- */
.rcjq-media__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
    gap: 18px;
}

/* ---------- Card ---------- */
.rcjq-media a.rcjq-media__card {
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid var(--rcjq-line);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none !important;
    color: var(--rcjq-ink);
    box-shadow: 0 2px 10px rgba(16, 31, 61, 0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}

.rcjq-media a.rcjq-media__card:hover,
.rcjq-media a.rcjq-media__card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--rcjq-green);
    box-shadow: 0 10px 24px rgba(16, 31, 61, 0.14);
}

.rcjq-media__thumb {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    margin: 0;
    background: rgba(25, 47, 89, 0.07);
}

/* Shown when a post has no image of its own. */
.rcjq-media__thumb--empty {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--rcjq-navy), var(--rcjq-navy-deep));
    color: var(--rcjq-green-bright);
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 3px;
}

.rcjq-media__body {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    padding: 15px 17px 17px;
}

.rcjq-media__meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

.rcjq-media__date {
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--rcjq-muted);
}

.rcjq-media__pill {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(25, 47, 89, 0.08);
    color: var(--rcjq-navy);
}

.rcjq-media__pill--facebook { background: #e7f0fb; color: #1a5fa8; }
.rcjq-media__pill--instagram { background: #fdeaf2; color: #b3247c; }
.rcjq-media__pill--linkedin { background: #e4f1f8; color: #0a5c86; }

.rcjq-media__excerpt {
    margin: 0;
    font-size: 0.88rem;
    line-height: 1.55;
    color: var(--rcjq-muted);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.rcjq-media__read {
    margin-top: 12px;
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--rcjq-green-dark);
}

/* ---------- Loading / fallback note ---------- */
.rcjq-media p.rcjq-media__note {
    grid-column: 1 / -1;
    margin: 0;
    padding: 22px 18px;
    text-align: center;
    font-size: 0.95rem;
    color: var(--rcjq-muted);
    background: rgba(25, 47, 89, 0.03);
    border: 1px dashed var(--rcjq-line);
    border-radius: 14px;
}

.rcjq-media p.rcjq-media__note a {
    color: var(--rcjq-green-dark);
    font-weight: 700;
}

/* ---------- Footer link ---------- */
.rcjq-media a.rcjq-media__all {
    display: inline-block;
    margin-top: 18px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--rcjq-green-dark);
    text-decoration: none !important;
}

.rcjq-media a.rcjq-media__all:hover { text-decoration: underline !important; }

@media (max-width: 480px) {
    .rcjq-media__grid { grid-template-columns: 1fr; gap: 14px; }
}
</style>

<script>
(function () {
    "use strict";

    /* ======================= CONFIG — edit these ======================= */
    var CONFIG = {
        // Where the published feed lives. Images in the feed are relative to
        // this, so keep the trailing slash on base.
        base: "https://margauxmedwards.github.io/robocup-qld/",
        feed: "data/social-posts.json",
        // How many cards to show.
        limit: 6,
        // Set to ["instagram"] (etc.) to show only certain platforms.
        platforms: ["facebook", "instagram", "linkedin"]
    };
    /* ================================================================== */

    var LABELS = {
        facebook: { label: "Facebook", url: "https://www.facebook.com/RoboCupJuniorQld/" },
        instagram: { label: "Instagram", url: "https://www.instagram.com/robocupjunior.qld/" },
        linkedin: { label: "LinkedIn", url: "https://www.linkedin.com/company/robocupjuniorqld" }
    };

    var grid = document.getElementById("rcjq-media-grid");
    if (!grid) return;

    function esc(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    // Captions run long and end in hashtag blocks; keep the readable part.
    function caption(text) {
        return String(text || "")
            .split("\n")
            .map(function (line) { return line.trim(); })
            .filter(function (line) { return line && line.charAt(0) !== "#"; })
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();
    }

    function absolute(path) {
        if (!path) return null;
        if (/^https?:\/\//i.test(path)) return path;
        return CONFIG.base.replace(/\/?$/, "/") + String(path).replace(/^\//, "");
    }

    function formatDate(iso) {
        var d = new Date(iso);
        if (isNaN(d)) return "";
        return d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
    }

    function thumb(post, text) {
        var src = absolute(post.image);
        if (!src) {
            var name = (LABELS[post.platform] || {}).label || "RCJQ";
            return '<span class="rcjq-media__thumb rcjq-media__thumb--empty" aria-hidden="true">' +
                esc(name) + "</span>";
        }
        return '<img class="rcjq-media__thumb" src="' + esc(src) + '" alt="' +
            esc(text.slice(0, 90) || "RCJQ social post") + '" loading="lazy" decoding="async">';
    }

    function card(post) {
        var meta = LABELS[post.platform] || { label: "RCJQ" };
        var text = caption(post.text);
        return '<a class="rcjq-media__card" href="' + esc(post.url) + '" target="_blank" rel="noopener">' +
            thumb(post, text) +
            '<span class="rcjq-media__body">' +
                '<span class="rcjq-media__meta">' +
                    '<span class="rcjq-media__date">' + esc(formatDate(post.date)) + "</span>" +
                    '<span class="rcjq-media__pill rcjq-media__pill--' + esc(post.platform) + '">' +
                        esc(meta.label) + "</span>" +
                "</span>" +
                (text ? '<span class="rcjq-media__excerpt">' + esc(text) + "</span>" : "") +
                '<span class="rcjq-media__read">View the post &rarr;</span>' +
            "</span>" +
        "</a>";
    }

    function fallback(profiles) {
        var links = CONFIG.platforms.map(function (key) {
            var url = (profiles && profiles[key]) || LABELS[key].url;
            return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' +
                LABELS[key].label + "</a>";
        }).join(" &middot; ");
        return '<p class="rcjq-media__note">Latest posts are on ' + links + ".</p>";
    }

    fetch(absolute(CONFIG.feed), { credentials: "omit" })
        .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
        })
        .then(function (feed) {
            var posts = (feed && feed.posts ? feed.posts : [])
                .filter(function (p) { return CONFIG.platforms.indexOf(p.platform) !== -1; })
                .slice(0, CONFIG.limit);

            grid.innerHTML = posts.length
                ? posts.map(card).join("")
                : fallback(feed && feed.profiles);
        })
        .catch(function (err) {
            if (window.console) console.error("RCJQ media feed failed:", err);
            grid.innerHTML = fallback(null);
        });
}());
</script>
